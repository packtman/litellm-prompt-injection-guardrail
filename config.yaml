# LiteLLM proxy config — Fireworks + Anthropic setup
# Start with:  cd /Users/dipen/litellm-env && set -a && source litellm.env && set +a && ./bin/litellm --config config.yaml --port 4000
# Requires on PYTHONPATH: pii_router.py, injection_judge.py, judge_prompt.txt (this dir)

