  # ===================== ANTHROPIC MODELS =====================

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Internal alias for the injection judge's own traffic — excluded from
  # routing/PII/judge guardrails so it can never recurse or be rerouted.
  - model_name: injection-judge
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ===================== LEGACY ALIASES (backward compat) =====================
  # The old "deepseek-v4" alias was actually pointing to kimi-k2p7-code.
  # Preserved for backward compatibility.

  - model_name: deepseek-v4
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/kimi-k2p7-code
      api_key: os.environ/FIREWORKS_API_KEY

guardrails:
  # Layer 0: regex hard-blocks + masks — local, free, runs first
  - guardrail_name: "hard-blocks"
    litellm_params:
      guardrail: pii_router.HardGuardrails
      mode: "pre_call"
      default_on: true

  # Layer 1: Presidio PII routing — PII never reaches Anthropic (short-circuits here)
  - guardrail_name: "pii-router"
    litellm_params:
      guardrail: pii_router.PIIRouter
      mode: "pre_call"
      default_on: true

  # Layer 1.5: prompt-injection judge — Haiku judges the newest user/tool message
  - guardrail_name: "injection-judge"
    litellm_params:
      guardrail: injection_judge.InjectionJudge
      mode: "pre_call"
      default_on: true

  # Layer 2: Anthropic decision layer — judgment on everything that remains
  - guardrail_name: "decision-layer"
    litellm_params:
      guardrail: pii_router.AnthropicDecisionLayer
      mode: "pre_call"
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
